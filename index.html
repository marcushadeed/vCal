<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --line: #d8dee4;
      --button: #f6f8fa;
      --error-bg: #ffebe9;
      --error-text: #82071e;
      --warn-bg: #fff8c5;
      --warn-text: #5c4400;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191d;
        --text: #e6e9ec;
        --muted: #9aa4ae;
        --line: #33393f;
        --button: #23282d;
        --error-bg: #4a1a1e;
        --error-text: #ffc1c0;
        --warn-bg: #3d3210;
        --warn-text: #f0dc8c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      padding: 16px;
      max-width: 800px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, sans-serif;
    }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
    h3 { margin: 16px 0 4px; color: var(--muted); font-size: 13px; }
    p { margin: 4px 0 8px; }
    button {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--button);
      color: inherit;
      font: inherit;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    input, select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: inherit;
      font: inherit;
    }
    input[type="checkbox"] { width: auto; margin: 0 4px 0 0; }
    select { width: auto; }
    label { color: var(--muted); font-size: 12px; }
    label input, label select { display: block; color: var(--text); font-size: 14px; }
    label.check { display: inline-flex; align-items: center; color: inherit; font-size: 14px; }
    label.check input { display: inline; }
    summary { padding: 4px 0; cursor: pointer; }
    .muted { color: var(--muted); }
    .notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 4px; overflow-wrap: anywhere; }
    .error { background: var(--error-bg); color: var(--error-text); }
    /* Actions happen far down the page, so the banners follow the scroll. */
    #banners { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    /* Disabled while working, so every control is blocked without a rebuild. */
    #content { min-width: 0; margin: 0; padding: 0; border: 0; }
    .warning { background: var(--warn-bg); color: var(--warn-text); }
    /* Shown while working (issue #10). Modal, so nothing behind it can be used. */
    #working {
      width: min(360px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    #working::backdrop { background: rgba(0, 0, 0, 0.4); }
    #working p { margin: 0 0 12px; }
    #working progress { display: block; width: 100%; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px 0; }
    .row .main { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
    .row .time { width: 64px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row .actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .blocked .main { color: var(--muted); }
    .fields { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; padding: 4px 0; }
    .fields label { flex: 1 1 120px; min-width: 0; }
    .fields label.check { flex: 0 0 auto; }
    .fields label.wide { flex: 1 1 100%; }
    .timepick { display: flex; gap: 4px; }
    .timepick select { display: inline-block; }
    .picker-name { flex: 1 1 160px; min-width: 0; }
    .form { margin-top: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
    .row .hours { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
    .row .share { width: 64px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .time-chart { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
    .time-legend { flex: 1 1 280px; min-width: 0; }
    .time-legend .row { flex-wrap: nowrap; }
    .time-legend .main { flex: 1 1 auto; }
    .time-legend .swatch { flex: 0 0 auto; }
    .pie { flex: 0 0 auto; }
    .row.total { margin-top: 4px; border-top: 1px solid var(--line); }
    .fields label.fit { flex: 0 0 auto; }
    /* A 2px gap between slices, in the page's own colour. */
    .pie path, .pie circle { stroke: var(--bg); stroke-width: 2; stroke-linejoin: round; }
    .pie path:hover, .pie circle:hover { opacity: 0.8; }
    /* After setup, one section at a time (issue #16). In the sticky banners, so it
       stays reachable from deep in Upcoming. */
    #tabs { display: flex; flex-wrap: wrap; padding-top: 12px; border-bottom: 1px solid var(--line); }
    #tabs button {
      margin-bottom: -1px;
      padding: 6px 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: none;
      color: var(--muted);
      font-size: 14px;
    }
    #tabs button[aria-selected="true"] { border-bottom-color: var(--text); color: var(--text); font-weight: 600; }
    #tabs .attention { color: var(--error-text); }
    #main { padding-top: 8px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .disclosure { margin-top: 32px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>vCal</h1>
    <span class="muted">Changes apply at the next sync</span>
  </header>

  <div id="banners">
    <div id="tabs" role="tablist" aria-label="Sections" hidden></div>
    <div id="error" class="notice error" role="alert" hidden></div>
  </div>

  <dialog id="working" aria-labelledby="working-text">
    <p id="working-text" role="status">Working...</p>
    <progress id="working-bar"></progress>
  </dialog>

  <fieldset id="content">
    <div id="warnings"></div>
    <div id="loading" class="muted">Loading...</div>
    <div id="setup" hidden></div>
    <div id="main" role="tabpanel" hidden></div>
  </fieldset>

  <p class="disclosure">vCal runs on its owner's Apps Script project. The owner can see when your syncs ran, and controls the code that can read and change your calendars. Google's error messages, which the owner can see, may include calendar IDs.</p>

  <script>
    var DAY_LABELS = [
      ['SU', 'Sun'], ['MO', 'Mon'], ['TU', 'Tue'], ['WE', 'Wed'], ['TH', 'Thu'], ['FR', 'Fri'], ['SA', 'Sat'],
    ];
    var FREQUENCY_LABELS = { daily: 'Daily', every6h: 'Every 6 hours', hourly: 'Hourly', every30m: 'Every 30 minutes' };
    var MATCH_LABELS = [
      ['exact', 'Exact title'], ['contains', 'Title contains'], ['regex', 'Regex (advanced)'], ['any', 'Any title'],
    ];
    var ANY_TITLE_PATTERN = '.*';

    var data = null;
    var busy = false;
    var working = false;
    // Names the Preview or Sync now whose progress is being polled, or null.
    var progressToken = null;
    var modalTimer = null;
    // Quick saves finish before the modal would appear, so it doesn't flash.
    var MODAL_DELAY_MS = 250;
    var PROGRESS_POLL_MS = 1500;

    // Everything typed into the page lives here rather than in the inputs, because
    // each render rebuilds them. A failed save must keep what the user typed.
    var ruleForm = emptyRuleForm();
    var sourceDraft = null;
    var sourceDraftDirty = false;
    var lookaheadDraft = null;
    var mirrorNameDraft = null;
    var frequencyDraft = null;
    var frequencyWarningEl = null;
    var searchQuery = '';
    var timePeriod = 'thisWeek';
    // Not saved, so each page load opens on Status.
    var currentTab = 'status';
    var TABS = [
      ['status', 'Status'], ['calendars', 'Calendars'], ['rules', 'Rules'], ['time', 'Time'], ['upcoming', 'Upcoming'],
    ];

    // Kept here and not reloaded. Cleared by anything that could make it out of date.
    var previewResult = null;
    var timeResult = null;

    var TIME_PERIODS = [
      ['thisWeek', 'This week'], ['lastWeek', 'Last week'],
      ['thisMonth', 'This month'], ['lastMonth', 'Last month'],
    ];
    // Google Calendar's event colours, by colour id.
    var EVENT_COLOR_HEX = {
      '1': '#7986cb', '2': '#33b679', '3': '#8e24aa', '4': '#e67c73', '5': '#f6bf26', '6': '#f4511e',
      '7': '#039be5', '8': '#616161', '9': '#3f51b5', '10': '#0b8043', '11': '#d50000',
    };

    var errorEl = document.getElementById('error');
    var workingEl = document.getElementById('working');
    var workingTextEl = document.getElementById('working-text');
    var workingBarEl = document.getElementById('working-bar');
    var tabsEl = document.getElementById('tabs');
    var warningsEl = document.getElementById('warnings');
    var loadingEl = document.getElementById('loading');
    var setupEl = document.getElementById('setup');
    var mainEl = document.getElementById('main');
    var contentEl = document.getElementById('content');
    var eventsEl = null;
    var ruleFormEl = null;

    // All calendar and rule text goes through textContent, because anyone who can
    // edit a shared calendar controls it.
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function button(label, onClick) {
      var node = el('button', '', label);
      node.type = 'button';
      node.disabled = busy;
      node.addEventListener('click', onClick);
      return node;
    }

    function clear(node) {
      node.className = '';
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    // Keeps what's on screen still while `change` resizes the banners or rebuilds
    // the page (issue #17). Once the user has scrolled into the content, banners
    // appearing above it mustn't push it down. Document coordinates, so it's right
    // whether or not the browser's own scroll anchoring already moved.
    function keepPlace(change) {
      var scrollY = window.scrollY;
      var rect = contentEl.getBoundingClientRect();
      var top = rect.top + scrollY;
      change();
      var moved = contentEl.getBoundingClientRect().top + window.scrollY - top;
      window.scrollTo(0, rect.top < 0 ? scrollY + moved : scrollY);
    }

    function showError(error) {
      keepPlace(function () {
        errorEl.textContent = (error && error.message) || String(error);
        errorEl.hidden = false;
      });
    }

    // A 12-hour picker for a stored 24-hour HH:MM value, or '' for none. 24:00 is
    // midnight at the end of the day, so an end time of 12:00 AM means 24:00. An
    // end of 00:00 or a start of 24:00 could never be valid anyway.
    function timePicker(value, isEnd, onChange) {
      var hour = '';
      var minute = '00';
      var period = 'AM';
      if (/^\d{2}:\d{2}$/.test(value)) {
        var hours24 = parseInt(value.substring(0, 2), 10) % 24;
        hour = String(hours24 % 12 || 12);
        minute = value.substring(3);
        period = hours24 < 12 ? 'AM' : 'PM';
      }
      var hours = [['', '--']];
      for (var h = 1; h <= 12; h++) hours.push([String(h), String(h)]);
      var minutes = [];
      for (var m = 0; m < 60; m++) {
        var padded = (m < 10 ? '0' : '') + m;
        minutes.push([padded, padded]);
      }
      function update() {
        if (hour === '') return onChange('');
        var hours24 = parseInt(hour, 10) % 12 + (period === 'PM' ? 12 : 0);
        if (isEnd && hours24 === 0 && minute === '00') return onChange('24:00');
        onChange((hours24 < 10 ? '0' : '') + hours24 + ':' + minute);
      }
      var node = el('span', 'timepick');
      var parts = [
        ['Hour', dropdown(hours, hour, function (v) { hour = v; update(); })],
        ['Minute', dropdown(minutes, minute, function (v) { minute = v; update(); })],
        ['AM or PM', dropdown([['AM', 'AM'], ['PM', 'PM']], period, function (v) { period = v; update(); })],
      ];
      parts.forEach(function (part) {
        part[1].setAttribute('aria-label', part[0]);
        node.appendChild(part[1]);
      });
      return node;
    }

    function labelled(text, control, className) {
      var node = el('label', className);
      node.appendChild(document.createTextNode(text));
      node.appendChild(control);
      return node;
    }

    function textInput(value, onInput, type) {
      var node = el('input');
      node.type = type || 'text';
      node.value = value;
      node.addEventListener('input', function () {
        onInput(node.value);
      });
      return node;
    }

    function checkbox(text, checked, onChange) {
      var input = el('input');
      input.type = 'checkbox';
      input.checked = checked;
      input.addEventListener('change', function () {
        onChange(input.checked);
      });
      var node = el('label', 'check');
      node.appendChild(input);
      node.appendChild(document.createTextNode(text));
      return node;
    }

    // `options` is a list of [value, label].
    function dropdown(options, value, onChange) {
      var node = el('select');
      options.forEach(function (option) {
        var item = el('option', '', option[1]);
        item.value = option[0];
        node.appendChild(item);
      });
      node.value = value;
      node.addEventListener('change', function () {
        onChange(node.value);
      });
      return node;
    }

    function formatDay(day) {
      var parts = day.split('-');
      return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
      });
    }

    function hasMirror() {
      return Boolean(data.settings.mirrorCalendarId) && !data.settings.mirrorMissing;
    }

    function currentFrequency() {
      return frequencyDraft || data.settings.frequency;
    }

    // --- Calendars ---------------------------------------------------------------

    // A stored source that's no longer in the user's calendar list stays in the
    // picker. It's the one a failed run names, and this is how it gets removed.
    function buildSourceDraft() {
      var stored = {};
      data.settings.sourceCalendars.forEach(function (source) {
        stored[source.id] = source;
      });
      var draft = data.calendars.map(function (calendar) {
        var source = stored[calendar.id];
        delete stored[calendar.id];
        return {
          id: calendar.id,
          checked: Boolean(source),
          name: source ? source.name : calendar.name,
          color: source && source.color ? source.color : '',
        };
      });
      data.settings.sourceCalendars.forEach(function (source) {
        if (stored[source.id]) {
          draft.push({ id: source.id, checked: true, name: source.name, color: source.color || '', unlisted: true });
        }
      });
      return draft;
    }

    function sourcesFromDraft() {
      return sourceDraft.filter(function (entry) {
        return entry.checked;
      }).map(function (entry) {
        var source = { id: entry.id, name: entry.name };
        if (entry.color) source.color = entry.color;
        return source;
      });
    }

    function renderSourcePicker(parent) {
      if (sourceDraft.length === 0) {
        parent.appendChild(el('p', 'muted', 'No calendars found.'));
        return;
      }
      var colorOptions = [['', 'Calendar default']].concat(data.colors.map(function (color) {
        return [color.id, color.name];
      }));
      sourceDraft.forEach(function (entry) {
        var row = el('div', 'row');
        var use = checkbox('', entry.checked, function (checked) {
          entry.checked = checked;
          sourceDraftDirty = true;
        });
        use.firstChild.setAttribute('aria-label', 'Copy from ' + entry.name);
        row.appendChild(use);
        var name = textInput(entry.name, function (value) {
          entry.name = value;
          sourceDraftDirty = true;
        });
        name.className = 'picker-name';
        name.setAttribute('aria-label', 'Name for this calendar');
        row.appendChild(name);
        var color = dropdown(colorOptions, entry.color, function (value) {
          entry.color = value;
          sourceDraftDirty = true;
        });
        color.setAttribute('aria-label', 'Colour for this calendar');
        row.appendChild(color);
        if (entry.unlisted) {
          row.appendChild(el('span', 'muted', 'No longer in your calendar list'));
        }
        parent.appendChild(row);
      });
      parent.appendChild(button('Save calendars', function () {
        act('saveSources', [sourcesFromDraft()], function () {
          sourceDraftDirty = false;
        });
      }));
    }

    // Creating when there's no mirror, renaming when there is. Only one is ever on
    // the page, so they share a draft.
    function mirrorNameFields() {
      var creating = !hasMirror();
      var fallback = creating ? data.settings.defaultMirrorName : data.settings.mirrorName;
      var input = textInput(mirrorNameDraft === null ? fallback : mirrorNameDraft, function (value) {
        mirrorNameDraft = value;
      });
      var fields = el('div', 'fields');
      fields.appendChild(labelled('Mirror calendar name', input));
      fields.appendChild(button(creating ? 'Create mirror calendar' : 'Rename', function () {
        act(creating ? 'createMirrorCalendar' : 'renameMirrorCalendar', [input.value], function () {
          mirrorNameDraft = null;
        });
      }));
      return fields;
    }

    // --- Rules -------------------------------------------------------------------

    function emptyRuleForm() {
      return {
        oldKey: null, match: 'exact', text: '', insensitive: false, days: [],
        timeStart: '', timeEnd: '', dateStart: '', dateEnd: '',
      };
    }

    function ruleFormFromRule(key, rule) {
      var form = emptyRuleForm();
      form.oldKey = key;
      if (rule.type === 'regex' && rule.value === ANY_TITLE_PATTERN && !rule.flags) {
        form.match = 'any';
      } else {
        form.match = rule.type;
        form.text = rule.value;
      }
      form.insensitive = rule.flags === 'i';
      form.days = (rule.days || []).slice();
      if (rule.time) {
        form.timeStart = rule.time.start;
        form.timeEnd = rule.time.end;
      }
      if (rule.date) {
        form.dateStart = rule.date.start;
        form.dateEnd = rule.date.end;
      }
      return form;
    }

    // The server validates this, and its errors appear in the banner.
    function ruleFromForm(form) {
      var rule;
      if (form.match === 'any') {
        rule = { type: 'regex', value: ANY_TITLE_PATTERN };
      } else {
        rule = { type: form.match, value: form.text };
        if (form.match === 'regex' && form.insensitive) rule.flags = 'i';
      }
      if (form.days.length > 0) rule.days = form.days.slice();
      if (form.timeStart || form.timeEnd) rule.time = { start: form.timeStart, end: form.timeEnd };
      if (form.dateStart || form.dateEnd) rule.date = { start: form.dateStart, end: form.dateEnd };
      return rule;
    }

    function renderRuleList(parent) {
      if (data.rules.length === 0) {
        parent.appendChild(el('p', 'muted', 'No rules yet. Every event in your source calendars will be mirrored.'));
        return;
      }
      data.rules.forEach(function (entry) {
        var row = el('div', 'row');
        row.appendChild(el('span', 'main', entry.description));
        var actions = el('span', 'actions');
        actions.appendChild(button('Edit', function () {
          ruleForm = ruleFormFromRule(entry.key, entry.rule);
          renderRuleForm();
          ruleFormEl.scrollIntoView();
        }));
        actions.appendChild(button('Delete', function () {
          act('deleteRule', [entry.key], function () {
            // The form may be editing the rule that's now gone.
            if (ruleForm.oldKey === entry.key) ruleForm = emptyRuleForm();
          });
        }));
        row.appendChild(actions);
        parent.appendChild(row);
      });
    }

    function renderRuleForm() {
      var form = ruleForm;
      clear(ruleFormEl);
      ruleFormEl.className = 'form';
      ruleFormEl.appendChild(el('h3', '', form.oldKey ? 'Edit rule' : 'Add a rule'));
      ruleFormEl.appendChild(el('p', 'muted', 'Events matching a rule are left out of your mirror.'));

      var titleFields = el('div', 'fields');
      titleFields.appendChild(labelled('Match', dropdown(MATCH_LABELS, form.match, function (value) {
        form.match = value;
        renderRuleForm();
      })));
      if (form.match !== 'any') {
        titleFields.appendChild(labelled(form.match === 'regex' ? 'Pattern' : 'Title', textInput(form.text, function (value) {
          form.text = value;
        })));
      }
      if (form.match === 'regex') {
        titleFields.appendChild(checkbox('Case-insensitive', form.insensitive, function (checked) {
          form.insensitive = checked;
        }));
      }
      ruleFormEl.appendChild(titleFields);

      var dayFields = el('div', 'fields');
      DAY_LABELS.forEach(function (day) {
        dayFields.appendChild(checkbox(day[1], form.days.indexOf(day[0]) !== -1, function (checked) {
          form.days = form.days.filter(function (code) {
            return code !== day[0];
          });
          if (checked) form.days.push(day[0]);
        }));
      });
      ruleFormEl.appendChild(dayFields);

      var limitFields = el('div', 'fields');
      limitFields.appendChild(labelled('From time', timePicker(form.timeStart, false, function (value) {
        form.timeStart = value;
      })));
      limitFields.appendChild(labelled('To time', timePicker(form.timeEnd, true, function (value) {
        form.timeEnd = value;
      })));
      limitFields.appendChild(labelled('From date', textInput(form.dateStart, function (value) {
        form.dateStart = value;
      }, 'date')));
      limitFields.appendChild(labelled('To date', textInput(form.dateEnd, function (value) {
        form.dateEnd = value;
      }, 'date')));
      ruleFormEl.appendChild(limitFields);
      ruleFormEl.appendChild(el('p', 'muted', 'Days, times and dates are optional, and use your calendar\'s time zone (' + data.timeZone + ').'));
      ruleFormEl.appendChild(el('p', 'muted', 'A time limit only looks at when an event starts. It excludes events starting at or after the From time and before the To time, so an event that starts earlier and runs into the window is still mirrored. All-day events count as starting at 12:00 AM. A To time of 12:00 AM means midnight at the end of the day.'));

      var actions = el('div', 'row');
      actions.appendChild(button(form.oldKey ? 'Save rule' : 'Add rule', function () {
        act('saveRule', [ruleFromForm(form), form.oldKey], function () {
          ruleForm = emptyRuleForm();
        });
      }));
      if (form.oldKey) {
        actions.appendChild(button('Cancel', function () {
          ruleForm = emptyRuleForm();
          renderRuleForm();
        }));
      }
      ruleFormEl.appendChild(actions);
    }

    function appendRuleForm(parent) {
      ruleFormEl = el('div', 'form');
      parent.appendChild(ruleFormEl);
      renderRuleForm();
    }

    // --- Preview -----------------------------------------------------------------

    function runPreview() {
      runLong('previewSync', function (result) {
        if (result.error) {
          showError(result.error);
          return;
        }
        previewResult = result.preview;
      });
    }

    function previewRow(entry) {
      var row = el('div', 'row');
      row.appendChild(el('span', 'main', entry.title || '(untitled)'));
      row.appendChild(el('span', 'muted', entry.start));
      row.appendChild(el('span', 'muted', entry.source));
      row.appendChild(el('span', 'muted', entry.reason));
      return row;
    }

    function appendPreviewList(parent, label, entries, open) {
      if (entries.length === 0) return;
      var details = el('details');
      details.open = Boolean(open);
      details.appendChild(el('summary', '', label + ' (' + entries.length + ')'));
      entries.forEach(function (entry) {
        details.appendChild(previewRow(entry));
      });
      parent.appendChild(details);
    }

    function renderPreview(parent) {
      if (!previewResult) return;
      var counts = previewResult.counts;
      parent.appendChild(el('h3', '', 'Preview. Nothing has been changed.'));
      parent.appendChild(el('p', '', counts.creates + ' to add, ' + counts.updates + ' to update, ' +
        counts.deletes + ' to delete, ' + counts.unchanged + ' unchanged, ' + counts.excluded + ' excluded by rules.'));
      if (previewResult.massDelete) {
        parent.appendChild(el('div', 'notice warning', 'This would delete most of your mirror, so scheduled syncs won\'t do it on their own. Check the list below. If it\'s what you want, click Sync now.'));
      }
      appendPreviewList(parent, 'To delete', previewResult.deletes, true);
      appendPreviewList(parent, 'To add', previewResult.creates);
      appendPreviewList(parent, 'To update', previewResult.updates);
      appendPreviewList(parent, 'Excluded by rules', previewResult.excludes);
    }

    // --- Sync --------------------------------------------------------------------

    function frequencyDropdown() {
      var options = Object.keys(FREQUENCY_LABELS).map(function (key) {
        return [key, FREQUENCY_LABELS[key]];
      });
      return labelled('How often', dropdown(options, currentFrequency(), function (value) {
        frequencyDraft = value;
        if (frequencyWarningEl) frequencyWarningEl.hidden = value !== 'every30m';
      }));
    }

    // Shown below Turn on sync. Only one is on the page at a time.
    function frequencyWarning() {
      frequencyWarningEl = el('div', 'notice warning', 'Google gives each personal account 90 minutes of scheduled running time a day. ' +
        'Syncing every 30 minutes uses that up if a run takes more than about 2 minutes, and syncs then stop until the next day.');
      frequencyWarningEl.hidden = currentFrequency() !== 'every30m';
      return frequencyWarningEl;
    }

    function turnOnButton() {
      var node = button('Turn on sync', function () {
        act('turnOnSync', [currentFrequency()], function () {
          frequencyDraft = null;
        });
      });
      node.disabled = busy || !data.settings.previewed;
      return node;
    }

    // --- First run ---------------------------------------------------------------

    function renderSetup() {
      setupEl.appendChild(el('h2', '', '1. Create your mirror calendar'));
      if (hasMirror()) {
        setupEl.appendChild(el('p', 'muted', 'Your mirror calendar is ready.'));
      } else {
        setupEl.appendChild(el('p', '', 'vCal copies events into a new calendar of its own. vCal owns that calendar, so anything you add to it by hand gets deleted. Give it a name you\'ll recognise, especially if you share it.'));
      }
      setupEl.appendChild(mirrorNameFields());

      setupEl.appendChild(el('h2', '', '2. Pick your source calendars'));
      setupEl.appendChild(el('p', 'muted', 'Tick the calendars to copy from. You can rename each one and choose a colour for its events in the mirror.'));
      renderSourcePicker(setupEl);

      setupEl.appendChild(el('h2', '', '3. Add rules (optional)'));
      renderRuleList(setupEl);
      appendRuleForm(setupEl);

      setupEl.appendChild(el('h2', '', '4. Preview'));
      setupEl.appendChild(el('p', 'muted', 'See what a sync would do. This changes nothing.'));
      if (sourceDraftDirty) {
        setupEl.appendChild(el('p', 'muted', 'You have unsaved calendar changes. Save them first to include them.'));
      }
      setupEl.appendChild(button('Preview', runPreview));
      renderPreview(setupEl);

      setupEl.appendChild(el('h2', '', '5. Turn on sync'));
      if (!data.settings.previewed) {
        setupEl.appendChild(el('p', 'muted', 'Run a preview first.'));
      }
      var fields = el('div', 'fields');
      fields.appendChild(frequencyDropdown());
      setupEl.appendChild(fields);
      setupEl.appendChild(turnOnButton());
      setupEl.appendChild(frequencyWarning());
    }

    // --- After setup -------------------------------------------------------------

    function statusLine(label, value) {
      var row = el('div', 'row');
      var name = el('span', 'muted', label);
      name.style.width = '120px';
      row.appendChild(name);
      row.appendChild(el('span', 'main', value));
      return row;
    }

    function renderStatus(parent) {
      var settings = data.settings;
      var status = data.status;
      if (data.stale) {
        parent.appendChild(el('div', 'notice warning', 'vCal hasn\'t recorded a sync when one was expected. Try Pause, then Turn on sync. If that doesn\'t help, the app may be unavailable, so ask its owner to check it.'));
      }
      parent.appendChild(statusLine('Sync', settings.enabled ? 'On' : 'Paused'));
      parent.appendChild(statusLine('How often', FREQUENCY_LABELS[settings.frequency]));
      parent.appendChild(statusLine('Last run', status ? new Date(status.lastRunAt).toLocaleString() : 'Not yet'));
      if (status && !status.error) {
        parent.appendChild(statusLine('Changes', status.created + ' added, ' + status.updated + ' updated, ' +
          status.deleted + ' deleted, ' + status.unchanged + ' unchanged'));
        if (status.deferred > 0) {
          parent.appendChild(statusLine('Deferred', status.deferred + ' left for the next run. Use Sync now to finish sooner.'));
        }
      }
      if (status && status.error) {
        parent.appendChild(el('div', 'notice error', status.error));
      }

      var actions = el('div', 'row');
      actions.appendChild(button('Preview', runPreview));
      var syncButton = button('Sync now', function () {
        runLong('syncNow', function (result) {
          if (result.busy) {
            showError('Another sync is already running. Try again in a few minutes.');
          }
        });
      });
      syncButton.disabled = busy || !settings.previewed;
      actions.appendChild(syncButton);
      if (settings.enabled) {
        actions.appendChild(button('Pause', function () {
          act('pauseSync', []);
        }));
      } else {
        actions.appendChild(frequencyDropdown());
        actions.appendChild(turnOnButton());
      }
      parent.appendChild(actions);
      if (!settings.enabled) {
        parent.appendChild(frequencyWarning());
      }
      renderPreview(parent);
    }

    function renderCalendars(parent) {
      parent.appendChild(el('h3', '', 'Mirror'));
      if (!hasMirror()) {
        parent.appendChild(el('div', 'notice warning', 'Your mirror calendar is missing, so vCal can\'t sync. If you deleted it, create a new one. vCal owns that calendar, so anything you add to it by hand gets deleted.'));
      }
      parent.appendChild(mirrorNameFields());
      parent.appendChild(el('h3', '', 'Sources'));
      renderSourcePicker(parent);

      var lookahead = lookaheadDraft === null ? String(data.settings.lookaheadDays) : lookaheadDraft;
      var fields = el('div', 'fields');
      var input = textInput(lookahead, function (value) {
        lookaheadDraft = value;
      }, 'number');
      fields.appendChild(labelled('Days to look ahead (1 to 365)', input));
      fields.appendChild(button('Save days', function () {
        act('saveLookaheadDays', [input.value], function () {
          lookaheadDraft = null;
        });
      }));
      parent.appendChild(fields);
    }

    function renderRules(parent) {
      renderRuleList(parent);
      appendRuleForm(parent);
    }

    function renderEventRow(event) {
      var row = el('div', event.blocked ? 'row blocked' : 'row');
      row.appendChild(el('span', 'time', event.allDay ? 'All day' : event.time));
      row.appendChild(el('span', 'main', event.title || '(untitled)'));
      row.appendChild(el('span', 'muted', event.sourceName));

      if (event.blocked) {
        row.appendChild(el('span', 'muted', 'blocked by a rule'));
        return row;
      }

      var actions = el('span', 'actions');
      actions.appendChild(button('Block this', function () {
        act('blockEvent', ['occurrence', event.title, event.start, event.allDay]);
      }));
      // A title block on an untitled event would block every untitled event.
      if (event.title.trim() !== '') {
        actions.appendChild(button('Block all titled this', function () {
          act('blockEvent', ['title', event.title, event.start, event.allDay]);
        }));
      }
      row.appendChild(actions);
      return row;
    }

    function renderEvents() {
      clear(eventsEl);
      var query = searchQuery.trim().toLowerCase();
      var matches = data.events.filter(function (event) {
        return event.title.toLowerCase().indexOf(query) !== -1;
      });
      if (matches.length === 0) {
        eventsEl.className = 'muted';
        eventsEl.textContent = query ? 'No events match your search.' : 'No upcoming events.';
        return;
      }
      // Only days with a matching event get a heading.
      var currentDay = null;
      matches.forEach(function (event) {
        if (event.day !== currentDay) {
          currentDay = event.day;
          eventsEl.appendChild(el('h3', '', formatDay(event.day)));
        }
        eventsEl.appendChild(renderEventRow(event));
      });
    }

    function renderUpcoming(parent) {
      var search = textInput(searchQuery, function (value) {
        searchQuery = value;
        renderEvents();
      }, 'search');
      search.placeholder = 'Search by title';
      search.setAttribute('aria-label', 'Search upcoming events by title');
      parent.appendChild(search);
      eventsEl = el('div');
      parent.appendChild(eventsEl);
      renderEvents();
    }

    // --- Time -------------------------------------------------------------------

    function formatHours(minutes) {
      var hours = Math.floor(minutes / 60);
      var rest = minutes % 60;
      return hours + 'h' + (rest ? ' ' + rest + 'm' : '');
    }

    function formatShare(minutes, total) {
      if (total <= 0 || minutes <= 0) return '0%';
      var share = Math.round(minutes / total * 100);
      return share === 0 ? 'under 1%' : share + '%';
    }

    // The pie's parts, which add up to the whole period. A source without a
    // colour takes the next event colour no source uses, in a fixed order, so
    // each keeps its own. The order's first six pass a colour-blindness check as
    // neighbours. Graphite is left out, being close to the overlap grey.
    var SPARE_COLOR_ORDER = ['7', '6', '3', '10', '4', '9', '2', '11', '1', '5'];

    function timeSlices(result) {
      var used = {};
      result.rows.forEach(function (row) {
        if (EVENT_COLOR_HEX[row.color]) used[row.color] = true;
      });
      var spare = SPARE_COLOR_ORDER.filter(function (id) {
        return !used[id];
      });
      var slices = result.rows.map(function (row) {
        var fill = EVENT_COLOR_HEX[row.color] || EVENT_COLOR_HEX[spare.shift()] || 'var(--muted)';
        return { name: row.name, minutes: row.minutes, fill: fill };
      });
      if (result.overlapMinutes > 0) {
        slices.push({ name: 'In more than one calendar', minutes: result.overlapMinutes, fill: 'var(--muted)' });
      }
      slices.push({ name: 'Unscheduled', minutes: result.freeMinutes, fill: 'var(--line)' });
      return slices;
    }

    function svgEl(tag, attributes) {
      var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.keys(attributes).forEach(function (name) {
        node.setAttribute(name, attributes[name]);
      });
      return node;
    }

    // Slices run clockwise from the top. Hovering one shows its figures, and the
    // list beside the chart holds the same figures for anyone who can't see it.
    function pieChart(slices, total) {
      var c = 90;
      var r = 88;
      var svg = svgEl('svg', { viewBox: '0 0 180 180', width: 180, height: 180, role: 'img', 'class': 'pie' });
      svg.setAttribute('aria-label', 'Pie chart of the period. The list beside it has the same figures.');
      var turned = 0;
      slices.forEach(function (slice) {
        if (slice.minutes <= 0 || total <= 0) return;
        var share = Math.min(slice.minutes / total, 1);
        var mark;
        if (share > 0.9999) {
          mark = svgEl('circle', { cx: c, cy: c, r: r });
        } else {
          var from = turned * 2 * Math.PI;
          var to = (turned + share) * 2 * Math.PI;
          mark = svgEl('path', {
            d: 'M' + c + ' ' + c +
              ' L' + (c + r * Math.sin(from)) + ' ' + (c - r * Math.cos(from)) +
              ' A' + r + ' ' + r + ' 0 ' + (share > 0.5 ? 1 : 0) + ' 1 ' +
              (c + r * Math.sin(to)) + ' ' + (c - r * Math.cos(to)) + ' Z',
          });
        }
        turned += share;
        mark.style.fill = slice.fill;
        var title = svgEl('title', {});
        title.textContent = slice.name + ': ' + formatHours(slice.minutes) + ' (' + formatShare(slice.minutes, total) + ')';
        mark.appendChild(title);
        svg.appendChild(mark);
      });
      return svg;
    }

    function timeLegendRow(name, fill, minutes, total) {
      var row = el('div', 'row');
      var swatch = el('span', 'swatch');
      if (fill) {
        swatch.style.background = fill;
      } else {
        swatch.style.visibility = 'hidden';
      }
      row.appendChild(swatch);
      row.appendChild(el('span', 'main', name));
      row.appendChild(el('span', 'hours', formatHours(minutes)));
      row.appendChild(el('span', 'share', formatShare(minutes, total)));
      return row;
    }

    function showTime() {
      setBusy(true);
      callServer('getTimeInsights', [timePeriod], function (result) {
        timeResult = result;
        setBusy(false);
      });
    }

    function renderTime(parent) {
      parent.appendChild(el('p', 'muted', 'How the period splits between your source calendars and unscheduled time. Only events vCal mirrors count, leaving out all-day and declined events. Time in more than one calendar at once has its own slice.'));
      var fields = el('div', 'fields');
      // The result names its own dates, so it can stay until Show is clicked.
      fields.appendChild(labelled('Period', dropdown(TIME_PERIODS, timePeriod, function (value) {
        timePeriod = value;
      }), 'fit'));
      fields.appendChild(button('Show', showTime));
      parent.appendChild(fields);
      if (!timeResult) return;

      timeResult.warnings.forEach(function (warning) {
        parent.appendChild(el('div', 'notice warning', warning));
      });
      parent.appendChild(el('h3', '', formatDay(timeResult.firstDay) + ' to ' + formatDay(timeResult.lastDay)));
      if (timeResult.rows.length === 0) {
        parent.appendChild(el('p', 'muted', 'Pick a source calendar first.'));
        return;
      }
      var total = timeResult.periodMinutes;
      var slices = timeSlices(timeResult);
      var chart = el('div', 'time-chart');
      chart.appendChild(pieChart(slices, total));
      var legend = el('div', 'time-legend');
      slices.forEach(function (slice) {
        legend.appendChild(timeLegendRow(slice.name, slice.fill, slice.minutes, total));
      });
      var scheduled = timeLegendRow('Scheduled in all', '', total - timeResult.freeMinutes, total);
      scheduled.className = 'row total';
      legend.appendChild(scheduled);
      chart.appendChild(legend);
      parent.appendChild(chart);
    }

    // --- Tabs --------------------------------------------------------------------

    // Only the open tab is rendered.
    function renderMain() {
      var renderers = {
        status: renderStatus, calendars: renderCalendars, rules: renderRules,
        time: renderTime, upcoming: renderUpcoming,
      };
      mainEl.setAttribute('aria-labelledby', 'tab-' + currentTab);
      renderers[currentTab](mainEl);
    }

    // A warning inside one section would go unseen from another tab.
    function tabNeedsAttention(key) {
      if (key === 'status') return Boolean(data.stale || (data.status && data.status.error));
      if (key === 'calendars') return !hasMirror();
      return false;
    }

    function openTab(key, focus) {
      currentTab = key;
      render();
      window.scrollTo(0, 0);
      if (focus) document.getElementById('tab-' + key).focus();
    }

    // The ARIA tabs pattern: one tab in the Tab order, arrows move between them.
    function renderTabs(show) {
      clear(tabsEl);
      tabsEl.hidden = !show;
      if (!show) return;
      TABS.forEach(function (tab, index) {
        var key = tab[0];
        var node = button(tab[1], function () {
          openTab(key, false);
        });
        node.id = 'tab-' + key;
        node.setAttribute('role', 'tab');
        node.setAttribute('aria-controls', 'main');
        node.setAttribute('aria-selected', String(key === currentTab));
        node.tabIndex = key === currentTab ? 0 : -1;
        if (tabNeedsAttention(key)) {
          var marker = el('span', 'attention', ' •');
          marker.setAttribute('aria-hidden', 'true');
          node.appendChild(marker);
          node.appendChild(el('span', 'visually-hidden', ' (needs attention)'));
        }
        node.addEventListener('keydown', function (event) {
          var next = {
            ArrowLeft: index - 1, ArrowRight: index + 1, Home: 0, End: TABS.length - 1,
          }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          openTab(TABS[(next + TABS.length) % TABS.length][0], true);
        });
        tabsEl.appendChild(node);
      });
    }

    // --- Page --------------------------------------------------------------------

    function renderWarnings() {
      clear(warningsEl);
      data.warnings.forEach(function (warning) {
        warningsEl.appendChild(el('div', 'notice warning', warning));
      });
      if (data.removedRulesNotice) {
        var notice = el('div', 'notice warning', data.removedRulesNotice + ' ');
        notice.appendChild(button('Dismiss', function () {
          act('dismissRemovedRules', []);
        }));
        warningsEl.appendChild(notice);
      }
    }

    function render() {
      var inSetup = !data.settings.enabled && !data.status;
      loadingEl.hidden = true;
      renderWarnings();
      renderTabs(!inSetup);
      clear(setupEl);
      clear(mainEl);
      setupEl.hidden = !inSetup;
      mainEl.hidden = inSetup;
      if (inSetup) {
        renderSetup();
      } else {
        renderMain();
      }
    }

    // --- Working modal -----------------------------------------------------------

    // Escape mustn't close it while busy. Chrome closes a dialog anyway on a second
    // Escape, so it's reopened.
    workingEl.addEventListener('cancel', function (event) {
      event.preventDefault();
    });
    workingEl.addEventListener('close', function () {
      if (busy) workingEl.showModal();
    });

    // `progress` is what getSyncProgress() returned, or null. Counts only. The bar
    // is indeterminate except while changes are being written.
    function showProgress(progress) {
      var text = working ? 'Working. This can take a few minutes.' : 'Working...';
      workingBarEl.removeAttribute('value');
      if (progress && progress.phase === 'read') {
        text = 'Reading calendar ' + progress.done + ' of ' + progress.total;
      } else if (progress && progress.phase === 'mirror') {
        text = 'Reading your mirror';
      } else if (progress && progress.phase === 'write') {
        text = 'Saving changes: ' + progress.done + ' of ' + progress.total;
        workingBarEl.max = progress.total;
        workingBarEl.value = progress.done;
      }
      workingTextEl.textContent = text;
    }

    function openModal() {
      showProgress(null);
      clearTimeout(modalTimer);
      modalTimer = setTimeout(function () {
        if (busy && !workingEl.open) workingEl.showModal();
      }, MODAL_DELAY_MS);
    }

    function closeModal() {
      clearTimeout(modalTimer);
      if (workingEl.open) workingEl.close();
    }

    // Runs until the call it belongs to returns. A failed poll is ignored, because
    // the call itself reports any error.
    function pollProgress(token) {
      setTimeout(function () {
        if (progressToken !== token) return;
        google.script.run
          .withSuccessHandler(function (progress) {
            if (progressToken !== token) return;
            if (progress) showProgress(progress);
            pollProgress(token);
          })
          .withFailureHandler(function () {
            pollProgress(token);
          })
          .getSyncProgress(token);
      }, PROGRESS_POLL_MS);
    }

    function stopProgress() {
      working = false;
      progressToken = null;
      showProgress(null);
    }

    // Starting only disables the page. Rebuilding it then made it jump. The page is
    // disabled at once, so it's blocked before the modal appears.
    function setBusy(value) {
      keepPlace(function () {
        busy = value;
        contentEl.disabled = value;
        if (value) errorEl.hidden = true;
        if (data && !value) render();
      });
      if (value) {
        openModal();
      } else {
        closeModal();
      }
    }

    // Failures show the banner and leave everything as it was.
    function callServer(name, args, onSuccess) {
      var runner = google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(function (error) {
          stopProgress();
          showError(error);
          if (!data) {
            errorEl.textContent += ' If you\'re signed in to more than one Google account, try an incognito window or sign out of the others.';
            loadingEl.textContent = 'Could not load.';
          }
          setBusy(false);
        });
      runner[name].apply(runner, args);
    }

    function refresh() {
      callServer('getPageData', [], function (result) {
        data = result;
        if (!sourceDraftDirty) sourceDraft = buildSourceDraft();
        setBusy(false);
      });
    }

    // Every action reloads from the server, so there is only one code path.
    // `onDone` runs only on success, before the reload.
    function act(name, args, onDone) {
      setBusy(true);
      callServer(name, args, function (result) {
        previewResult = null;
        timeResult = null;
        if (onDone) onDone(result);
        refresh();
      });
    }

    // The same, for calls that can take minutes, which report their progress.
    // The preview stays until the call succeeds, so the page doesn't shrink.
    function runLong(name, onDone) {
      var token = Date.now().toString(36) + Math.random().toString(36).slice(2);
      working = true;
      progressToken = token;
      setBusy(true);
      pollProgress(token);
      callServer(name, [token], function (result) {
        stopProgress();
        previewResult = null;
        timeResult = null;
        if (onDone) onDone(result);
        refresh();
      });
    }

    refresh();
  </script>
</body>
</html>
